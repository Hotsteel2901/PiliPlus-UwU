# 在 issue / PR 评论里发送 `/oc <任务>` 或 `/opencode <任务>` 触发 OpenCode。
#
# 使用前需要在仓库 Secrets 里添加：
#   OPENCODE_API_KEY  —— OpenCode Go 的 API Key（在 https://opencode.ai/console 订阅 Go 后获取）
#
# 权限已按「全权限开放」配置（permissions: write-all + opencode --auto），
# 因此请确认仓库 Settings -> Actions -> General -> Workflow permissions 允许读写。

name: OpenCode

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]

permissions: write-all

jobs:
    opencode:
        name: Run OpenCode
        # 仅当评论包含触发词，且评论者拥有写权限时才运行，避免陌生人刷 API 额度。
        # 如需放开给所有人，删除 author_association 那一行即可。
        if: |
            (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
            contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        runs-on: ubuntu-latest

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 安装 OpenCode
              run: curl -fsSL https://opencode.ai/v2/install | bash

            - name: 记录评论编号
              id: target
              env:
                  COMMENT_BODY: ${{ github.event.comment.body }}
              run: |
                  echo "number=${{ github.event.issue.number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
                  # 去掉行首的 /oc 或 /opencode 触发词，剩余内容作为任务
                  printf '%s' "$COMMENT_BODY" | sed -E 's#^[[:space:]]*/(opencode|oc)[[:space:]]*##' > "$RUNNER_TEMP/prompt.txt"

            - name: 运行 OpenCode
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  REPO: ${{ github.repository }}
                  AUTHOR: ${{ github.event.comment.user.login }}
                  COMMENT_URL: ${{ github.event.comment.html_url }}
              run: |
                  {
                      echo "你是 OpenCode，作为 GitHub Actions 机器人运行在仓库 $REPO 的检出目录中。"
                      echo "请完成下面这条来自评论的任务请求。"
                      echo
                      echo "任务请求："
                      cat "$RUNNER_TEMP/prompt.txt"
                      echo
                      echo "---"
                      echo "说明："
                      echo "- 你可以直接读写代码、执行命令、运行测试。"
                      echo "- 如需改动代码，完成修改后提交并推送，必要时创建 Pull Request。"
                      echo "- 最终回复使用 Markdown，保持简洁；它会被直接贴回评论。"
                      echo "- 触发者：$AUTHOR"
                      echo "- 评论链接：$COMMENT_URL"
                  } > "$RUNNER_TEMP/message.txt"

                  opencode run --standalone --auto --model opencode-go/deepseek-v4.1-flash "$(cat "$RUNNER_TEMP/message.txt")" > "$RUNNER_TEMP/result.md"

            - name: 回复评论
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NUMBER: ${{ steps.target.outputs.number }}
              run: |
                  if [ ! -s "$RUNNER_TEMP/result.md" ]; then
                      echo "OpenCode 本次运行没有产生输出，请查看 Actions 日志。" > "$RUNNER_TEMP/result.md"
                  fi
                  # GitHub 单条评论上限 65536 字符，超长截断
                  head -c 60000 "$RUNNER_TEMP/result.md" > "$RUNNER_TEMP/comment.md"
                  gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
